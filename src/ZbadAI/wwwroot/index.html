<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZbadAI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f3f5f7; color: #1d2733; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 16px; background: #0f6e6e; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    header button { background: transparent; color: #fff; border: 1px solid #fff8; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 820px; width: 100%; margin: 0 auto; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; line-height: 1.45; }
    .user { align-self: flex-end; background: #0f6e6e; color: #fff; }
    .assistant { align-self: flex-start; background: #fff; border: 1px solid #dde3e8; }
    .error { align-self: center; background: #fdecea; color: #8a1c13; font-size: 14px; }
    form { display: flex; gap: 8px; padding: 12px 16px; max-width: 820px; width: 100%; margin: 0 auto; }
    textarea { flex: 1; resize: none; height: 56px; padding: 10px; border-radius: 8px; border: 1px solid #c5ced6; font: inherit; }
    form button { padding: 0 18px; border: 0; border-radius: 8px; background: #0f6e6e; color: #fff; font: inherit; cursor: pointer; }
    form button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>ZbadAI — asystent medycyny pracy</h1>
    <button id="reset" type="button">Nowa rozmowa</button>
  </header>
  <div id="chat"></div>
  <form id="form">
    <textarea id="input" maxlength="4000" placeholder="Np. Mam na skierowaniu pracę przy monitorze. Jakie badania mnie czekają?"></textarea>
    <button id="send" type="submit">Wyślij</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const MAX_HISTORY = 20;
    let history = [];

    function bubble(cls, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    async function ask(text) {
      history.push({ role: 'user', content: text });
      history = history.slice(-MAX_HISTORY);
      bubble('user', text);
      send.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });
        if (!res.ok) {
          history.pop();
          bubble('error', await res.text());
          return;
        }
        const el = bubble('assistant', '');
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let answer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          answer += decoder.decode(value, { stream: true });
          el.textContent = answer;
          chat.scrollTop = chat.scrollHeight;
        }
        history.push({ role: 'assistant', content: answer });
      } catch (e) {
        history.pop();
        bubble('error', 'Brak połączenia z serwerem.');
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      input.value = '';
      ask(text);
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });

    document.getElementById('reset').addEventListener('click', () => {
      history = [];
      chat.innerHTML = '';
      input.focus();
    });
  </script>
</body>
</html>
